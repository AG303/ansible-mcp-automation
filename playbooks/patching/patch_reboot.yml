---
# PATCH - Controlled reboot
# Domain: Patch Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES SYSTEMS. Reboots hosts in batches, waits for them to return and verifies critical services. Use the WF
# workflow (approval required).
# Survey variables: only_if_required, serial_pct, critical_services

- name: PATCH - Controlled reboot
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  serial: "{{ aap_ops_serial }}"
  vars:
    aap_ops_report_title: PATCH - Controlled reboot
    aap_ops_serial: "{{ serial_pct | default(25) }}%"
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Halt remaining batches after a failed batch
      when: hostvars['localhost']._aap_ops_batch_failed | default(false) | bool
      block:
        - name: Mark host skipped
          ansible.builtin.set_fact:
            aap_ops_host_result:
              status: skipped
              summary: Not attempted - an earlier rolling batch failed
              details: {}
        - name: Stop processing this host
          ansible.builtin.meta: end_host
    - name: Run patch_manage/reboot
      ansible.builtin.include_role:
        name: devops.aap_ops.patch_manage
        tasks_from: reboot
    - name: Record batch failure for the next batch
      run_once: true
      delegate_to: localhost
      delegate_facts: true
      ansible.builtin.set_fact:
        _aap_ops_batch_failed: "{{ hostvars['localhost']._aap_ops_batch_failed | default(false) | bool or 'fail' in _batch_status }}"
      vars:
        _batch_status: "{{ ansible_play_batch | map('extract', hostvars) | map(attribute='aap_ops_host_result', default={}) | map(attribute='status', default='fail') | list }}"

- name: Report - PATCH - Controlled reboot
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: PATCH - Controlled reboot
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
