---
# PATCH - Configure update source
# Domain: Patch Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES SYSTEMS. Points hosts at their update source - vendor repos, Red Hat Satellite, an apt mirror, or WSUS
# - using inventory variables. Use the WF workflow (approval required).
# Survey variables: patch_source

- name: PATCH - Configure update source
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: PATCH - Configure update source
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run patch_source/configure
      ansible.builtin.include_role:
        name: devops.aap_ops.patch_source
        tasks_from: configure

- name: Report - PATCH - Configure update source
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: PATCH - Configure update source
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
