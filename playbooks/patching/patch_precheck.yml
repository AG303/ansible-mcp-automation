---
# PATCH - Pre-patch readiness
# Domain: Patch Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Free space, repository/update source reachability, pending reboot, package manager locks and
# running critical services before patching. Returns aap_ops_result.
# Survey variables: min_free_mb, critical_services

- name: PATCH - Pre-patch readiness
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: PATCH - Pre-patch readiness
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run patch_manage/precheck
      ansible.builtin.include_role:
        name: devops.aap_ops.patch_manage
        tasks_from: precheck

- name: Report - PATCH - Pre-patch readiness
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: PATCH - Pre-patch readiness
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
