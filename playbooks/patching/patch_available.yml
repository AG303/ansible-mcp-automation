---
# PATCH - Available updates
# Domain: Patch Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Lists available updates per host (security-only optional) with counts by severity where the OS
# reports it. Returns aap_ops_result.
# Survey variables: security_only

- name: PATCH - Available updates
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: PATCH - Available updates
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run patch_manage/available
      ansible.builtin.include_role:
        name: devops.aap_ops.patch_manage
        tasks_from: available

- name: Report - PATCH - Available updates
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: PATCH - Available updates
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
