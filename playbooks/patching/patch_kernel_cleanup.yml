---
# PATCH - Old kernel cleanup
# Domain: Patch Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES SYSTEMS. Removes old kernels keeping the running kernel plus N most recent (Linux only). Use the WF
# workflow (approval required).
# Survey variables: keep_kernels

- name: PATCH - Old kernel cleanup
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: PATCH - Old kernel cleanup
    aap_ops_supported_os:
      - rhel
      - ubuntu
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run patch_manage/kernel_cleanup
      ansible.builtin.include_role:
        name: devops.aap_ops.patch_manage
        tasks_from: kernel_cleanup

- name: Report - PATCH - Old kernel cleanup
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: PATCH - Old kernel cleanup
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
