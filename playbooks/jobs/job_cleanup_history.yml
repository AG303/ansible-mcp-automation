---
# JOB - Run job history cleanup
# Domain: Job Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES PLATFORM. Launches the built-in Cleanup Job Details system job keeping N days. Use the WF workflow
# (approval required).
# Survey variables: keep_days

- name: JOB - Run job history cleanup
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: JOB - Run job history cleanup
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_jobs/cleanup_history
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_jobs
        tasks_from: cleanup_history
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
