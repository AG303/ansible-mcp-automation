---
# JOB - Pending workflow approvals
# Domain: Job Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Lists pending workflow approvals with workflow name, requester and age so an agent can tell a human
# what is waiting. Returns aap_ops_result.

- name: JOB - Pending workflow approvals
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: JOB - Pending workflow approvals
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_jobs/workflow_approvals
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_jobs
        tasks_from: workflow_approvals
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
