---
# JOB - Job template hygiene audit
# Domain: Job Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Templates with no runs in N days, high failure rate, missing execution environment, or prompt-on-
# launch everything. Returns aap_ops_result.
# Survey variables: stale_days, failure_rate_pct

- name: JOB - Job template hygiene audit
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: JOB - Job template hygiene audit
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_jobs/template_audit
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_jobs
        tasks_from: template_audit
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
