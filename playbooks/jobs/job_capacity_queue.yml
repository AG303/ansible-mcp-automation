---
# JOB - Queue and capacity status
# Domain: Job Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Pending/waiting/running job counts, instance group capacity and consumed capacity, and jobs waiting
# longest. Returns aap_ops_result.

- name: JOB - Queue and capacity status
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: JOB - Queue and capacity status
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_jobs/capacity_queue
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_jobs
        tasks_from: capacity_queue
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
