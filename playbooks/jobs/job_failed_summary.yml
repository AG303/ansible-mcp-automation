---
# JOB - Failed jobs summary
# Domain: Job Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Failed/error jobs in the last N hours with template, launcher, failed hosts and the failing task
# output excerpt. Returns aap_ops_result.
# Survey variables: hours, template_filter

- name: JOB - Failed jobs summary
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: JOB - Failed jobs summary
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_jobs/failed_summary
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_jobs
        tasks_from: failed_summary
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
