---
# JOB - Host failure trend
# Domain: Job Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Hosts with the most failed or unreachable job events over N days, with the templates involved.
# Returns aap_ops_result.
# Survey variables: days, top_n

- name: JOB - Host failure trend
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: JOB - Host failure trend
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_jobs/host_failure_trend
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_jobs
        tasks_from: host_failure_trend
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
