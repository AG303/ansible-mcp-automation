---
# JOB - Launch template in batches
# Domain: Job Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES SYSTEMS. Launches another job template against a limit in sequential batches and stops on the first
# failed batch. Use the WF workflow (approval required).
# Survey variables: launch_template_name, launch_limit, batch_size

- name: JOB - Launch template in batches
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: JOB - Launch template in batches
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_jobs/launch_template
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_jobs
        tasks_from: launch_template
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
