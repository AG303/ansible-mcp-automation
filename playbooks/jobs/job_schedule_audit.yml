---
# JOB - Schedule audit
# Domain: Job Management. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. All schedules with enabled state, next run, RRULE and target; flags disabled, expired and never-run
# schedules. Returns aap_ops_result.
# Survey variables: name_filter

- name: JOB - Schedule audit
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: JOB - Schedule audit
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_jobs/schedule_audit
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_jobs
        tasks_from: schedule_audit
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
