---
# SN - ServiceNow connection test
# Domain: ServiceNow Incident. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Verifies the ServiceNow credential, instance reachability, build version and read access to
# incident, change_request, problem and cmdb_ci tables. Returns aap_ops_result.

- name: SN - ServiceNow connection test
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - ServiceNow connection test
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: Run sn_api/connection_test
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        tasks_from: connection_test
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
