---
# SN - Create change request
# Domain: ServiceNow Incident. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Writes ServiceNow records only. Creates a normal, standard or emergency change request for an AAP template
# with planned start/end window, affected CIs and an implementation/backout plan. Returns the change number for
# use as sn_change_number.
# Survey variables: sn_change_type, sn_template_name, sn_short_description, sn_planned_start, sn_planned_end,
#   sn_affected_hosts, sn_assignment_group, sn_risk

- name: SN - Create change request
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - Create change request
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: Run sn_change/create
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_change
        tasks_from: create
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
