---
# SN - CMDB server CI sync
# Domain: ServiceNow Incident, Change and Problem. Handwritten hybrid (hosts -> localhost).
# Collects host facts and creates/updates cmdb_ci_server records (dry run by default).
# Survey variables: sn_dry_run

- name: SN - CMDB server CI sync - collect facts
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: SN - CMDB server CI sync
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Build CI payload from facts
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_cmdb
        tasks_from: host_facts

- name: SN - CMDB server CI sync - write CMDB and report
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - CMDB server CI sync
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: Sync cmdb_ci_server
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_cmdb
        tasks_from: sync
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
