---
# SN - Incident from failed job
# Domain: ServiceNow Incident. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Writes ServiceNow records only. Reads a failed AAP job or workflow (failed nodes, failed hosts, failing task)
# and opens or updates a de-duplicated incident with the evidence. Used automatically as the failure node of
# every WF workflow; can also be launched with a job ID. Returns the incident number.
# Survey variables: sn_source_job_id, sn_impact, sn_urgency

- name: SN - Incident from failed job
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - Incident from failed job
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: AAP API connection (job evidence / workflow context)
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run sn_incident/from_job
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_incident
        tasks_from: from_job
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
