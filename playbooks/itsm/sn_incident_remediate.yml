---
# SN - Incident remediation
# Domain: ServiceNow Incident, Change and Problem. Handwritten hybrid (localhost -> incident hosts -> localhost).
# CHANGES SYSTEMS. Runs an allow-listed remediation on the incident's hosts, re-checks health, posts a work note and optionally resolves the incident.
# Survey variables: sn_incident_number, remediation_action, service_name, resolve_on_success

- name: SN - Incident remediation - resolve incident targets
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - Incident remediation
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: Read the incident and map its CI / correlation ID to inventory hosts
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_incident
        tasks_from: resolve_targets
    - name: Put the incident hosts into an in-memory group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: sn_incident_targets
      loop: "{{ _sn_targets }}"
      changed_when: false

- name: SN - Incident remediation - run on incident hosts
  hosts: sn_incident_targets
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: SN - Incident remediation
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run sn_incident/remediate_host
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_incident
        tasks_from: remediate_host

- name: SN - Incident remediation - update incident and report
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - Incident remediation
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default(hostvars['localhost']._sn_targets | default([])) }}"
  tasks:
    - name: ServiceNow connection (role defaults are play-scoped)
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: Write results back to the incident
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_incident
        tasks_from: post_remediation
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
