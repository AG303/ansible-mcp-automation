---
# SN - Update or resolve problem
# Domain: ServiceNow Incident. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Writes ServiceNow records only. Records cause and fix notes, moves the problem state, or resolves it with a
# resolution code (fix_applied, risk_accepted, duplicate, canceled). Returns the updated problem.
# Survey variables: sn_problem_number, sn_problem_state, sn_cause_notes, sn_fix_notes, sn_resolution_code

- name: SN - Update or resolve problem
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - Update or resolve problem
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: Run sn_problem/update
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_problem
        tasks_from: update
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
