---
# SN - Open problems report
# Domain: ServiceNow Incident. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Open problems with state, age, linked incident count and known-error flag. Returns aap_ops_result.
# Survey variables: sn_assignment_group

- name: SN - Open problems report
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - Open problems report
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: Run sn_problem/list
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_problem
        tasks_from: list
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
