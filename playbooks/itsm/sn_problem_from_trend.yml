---
# SN - Problem candidates from incident trend
# Domain: ServiceNow Incident. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Writes ServiceNow records when create_problems=yes. Groups incidents from the last N days by configuration
# item and correlation ID; groups at or above the threshold become problem candidates and, optionally, problems
# with the incidents linked. Returns aap_ops_result.
# Survey variables: days, min_incidents, create_problems

- name: SN - Problem candidates from incident trend
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - Problem candidates from incident trend
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: Run sn_problem/from_trend
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_problem
        tasks_from: from_trend
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
