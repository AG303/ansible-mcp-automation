---
# SN - Create problem
# Domain: ServiceNow Incident. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Writes ServiceNow records only. Opens a problem record and links the listed incidents to it. Returns the
# problem number.
# Survey variables: sn_short_description, sn_description, sn_incident_numbers, sn_impact, sn_urgency

- name: SN - Create problem
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - Create problem
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: Run sn_problem/create
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_problem
        tasks_from: create
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
