---
# SN - Open incidents report
# Domain: ServiceNow Incident. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Open incidents filtered by assignment group, priority or AAP-created only, with age, CI and state
# so an agent can pick what to work on. Returns aap_ops_result.
# Survey variables: sn_assignment_group, sn_max_priority, sn_aap_only

- name: SN - Open incidents report
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - Open incidents report
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: Run sn_incident/list
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_incident
        tasks_from: list
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
