---
# SN - Change close
# Domain: ServiceNow Incident. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Writes ServiceNow records only. Moves a change to Review with close code successful, successful_issues or
# unsuccessful and close notes built from the AAP job results. Runs automatically at the end of every WF
# workflow.
# Survey variables: sn_change_number, sn_close_code, sn_close_notes

- name: SN - Change close
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - Change close
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: AAP API connection (job evidence / workflow context)
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
      when: tower_workflow_job_id is defined or awx_workflow_job_id is defined
    - name: Run sn_change/close
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_change
        tasks_from: close
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
