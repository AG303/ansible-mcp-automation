---
# SN - Upcoming and active changes
# Domain: ServiceNow Incident. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Change requests that are scheduled or implementing within the next N days with window, approval,
# type and CIs; flags approved changes with no matching AAP run and expired windows. Returns aap_ops_result.
# Survey variables: days, sn_assignment_group

- name: SN - Upcoming and active changes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SN - Upcoming and active changes
  tasks:
    - name: ServiceNow connection
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_api
        public: true
    - name: Run sn_change/schedule
      ansible.builtin.include_role:
        name: devops.aap_ops.sn_change
        tasks_from: schedule
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
