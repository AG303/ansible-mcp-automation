---
# PLAT - Export configuration snapshot
# Domain: Platform Configuration. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Exports controller settings and organizations, projects, inventories, templates and credentials (no
# secrets) to a JSON snapshot for drift review. Returns aap_ops_result.

- name: PLAT - Export configuration snapshot
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: PLAT - Export configuration snapshot
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_platform_config/settings_export
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_platform_config
        tasks_from: settings_export
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
