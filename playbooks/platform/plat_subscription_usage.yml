---
# PLAT - Subscription and host usage
# Domain: Platform Configuration. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Subscription status, licensed versus automated host counts and deleted-host counts from the
# controller config endpoint. Returns aap_ops_result.

- name: PLAT - Subscription and host usage
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: PLAT - Subscription and host usage
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_platform_config/subscription_usage
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_platform_config
        tasks_from: subscription_usage
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
