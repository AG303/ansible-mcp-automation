---
# PLAT - Execution environment audit
# Domain: Platform Configuration. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Execution environments with image, tag, pull policy, credential and usage; flags latest tags and
# unused EEs. Returns aap_ops_result.

- name: PLAT - Execution environment audit
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: PLAT - Execution environment audit
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_platform_config/ee_audit
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_platform_config
        tasks_from: ee_audit
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
