# Survey variables: aap_namespace, aap_cr_name

- name: PLAT - MCP server status
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: PLAT - MCP server status
  tasks:
    - name: Run aap_operator/mcp_status
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_operator
        tasks_from: mcp_status
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
