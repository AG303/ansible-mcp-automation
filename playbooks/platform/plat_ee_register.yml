---
# PLAT - Register execution environment
# Domain: Platform Configuration. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES PLATFORM. Creates or updates an execution environment definition (name, image, pull policy,
# organization). Use the WF workflow (approval required).
# Survey variables: ee_name, ee_image, ee_pull, ee_organization

- name: PLAT - Register execution environment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: PLAT - Register execution environment
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_platform_config/ee_register
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_platform_config
        tasks_from: ee_register
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
