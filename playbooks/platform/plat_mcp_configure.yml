---
# PLAT - Enable or disable MCP server
# Domain: Platform Configuration. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES PLATFORM. Sets spec.mcp on the AnsibleAutomationPlatform custom resource and waits for the operator to
# reconcile. Use the WF workflow (approval required).
# Survey variables: aap_namespace, aap_cr_name, mcp_enabled

- name: PLAT - Enable or disable MCP server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: PLAT - Enable or disable MCP server
  tasks:
    - name: Run aap_operator/mcp_configure
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_operator
        tasks_from: mcp_configure
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
