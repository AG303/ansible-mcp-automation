---
# PLAT - Instance and container group audit
# Domain: Platform Configuration. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Instance groups and container groups with capacity, policy, pod spec override presence and attached
# templates. Returns aap_ops_result.

- name: PLAT - Instance and container group audit
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: PLAT - Instance and container group audit
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_platform_config/instance_groups
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_platform_config
        tasks_from: instance_groups
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
