---
# PLAT - Apply config-as-code
# Domain: Platform Configuration. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES PLATFORM. Applies aap_config/vars with infra.aap_configuration dispatch (projects, inventories,
# templates, workflows, schedules, RBAC). Use the WF workflow (approval required).

- name: PLAT - Apply config-as-code
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: PLAT - Apply config-as-code
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_platform_config/config_apply
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_platform_config
        tasks_from: config_apply
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
