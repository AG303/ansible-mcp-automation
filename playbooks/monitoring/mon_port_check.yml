---
# MON - Port and endpoint reachability
# Domain: Server Monitoring. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Tests TCP connectivity from each host to host:port targets and lists local listening ports. Returns
# aap_ops_result.
# Survey variables: endpoints, timeout_sec

- name: MON - Port and endpoint reachability
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: MON - Port and endpoint reachability
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run host_monitor/port_check
      ansible.builtin.include_role:
        name: devops.aap_ops.host_monitor
        tasks_from: port_check

- name: Report - MON - Port and endpoint reachability
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: MON - Port and endpoint reachability
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
