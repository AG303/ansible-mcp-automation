---
# MON - Top processes
# Domain: Server Monitoring. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Top N processes by CPU and by memory on each host. Returns aap_ops_result.
# Survey variables: top_n

- name: MON - Top processes
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: MON - Top processes
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run host_monitor/top_processes
      ansible.builtin.include_role:
        name: devops.aap_ops.host_monitor
        tasks_from: top_processes

- name: Report - MON - Top processes
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: MON - Top processes
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
