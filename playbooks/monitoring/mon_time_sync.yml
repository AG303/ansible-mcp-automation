---
# MON - Time synchronization status
# Domain: Server Monitoring. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. chrony/systemd-timesyncd/w32time sync state and offset. Returns aap_ops_result.
# Survey variables: max_offset_ms

- name: MON - Time synchronization status
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: MON - Time synchronization status
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run host_monitor/time_sync
      ansible.builtin.include_role:
        name: devops.aap_ops.host_monitor
        tasks_from: time_sync

- name: Report - MON - Time synchronization status
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: MON - Time synchronization status
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
