---
# MON - Restart service with validation
# Domain: Server Monitoring. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES SYSTEMS. Restarts one service, waits for it to report running and optionally checks a TCP port. Use
# the WF workflow (approval required).
# Survey variables: service_name, verify_port

- name: MON - Restart service with validation
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: MON - Restart service with validation
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run host_monitor/service_restart
      ansible.builtin.include_role:
        name: devops.aap_ops.host_monitor
        tasks_from: service_restart

- name: Report - MON - Restart service with validation
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: MON - Restart service with validation
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
