---
# MON - Service status check
# Domain: Server Monitoring. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Reports whether named services/units are installed, running and enabled. Returns aap_ops_result.
# Survey variables: service_names

- name: MON - Service status check
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: MON - Service status check
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run host_monitor/service_status
      ansible.builtin.include_role:
        name: devops.aap_ops.host_monitor
        tasks_from: service_status

- name: Report - MON - Service status check
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: MON - Service status check
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
