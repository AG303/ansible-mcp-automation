---
# MON - TLS certificate expiry
# Domain: Server Monitoring. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Checks certificate files on hosts and remote TLS endpoints for days to expiry. Returns
# aap_ops_result.
# Survey variables: cert_paths, tls_endpoints, warn_days

- name: MON - TLS certificate expiry
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: MON - TLS certificate expiry
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run host_monitor/cert_expiry
      ansible.builtin.include_role:
        name: devops.aap_ops.host_monitor
        tasks_from: cert_expiry

- name: Report - MON - TLS certificate expiry
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: MON - TLS certificate expiry
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
