---
# SEC - AAP token audit
# Domain: Security Compliance. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Personal access tokens and OAuth applications with owner, scope, created and expiry; flags write-
# scoped and long-lived tokens (including MCP agent tokens). Returns aap_ops_result.
# Survey variables: max_age_days

- name: SEC - AAP token audit
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SEC - AAP token audit
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_security_audit/token
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_security_audit
        tasks_from: token
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
