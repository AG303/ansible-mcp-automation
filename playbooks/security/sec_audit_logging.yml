---
# SEC - Audit logging configuration
# Domain: Security Compliance. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES SYSTEMS. Configures auditd with baseline rules (Linux) or Advanced Audit Policy categories (Windows)
# and verifies the service. Use the WF workflow (approval required).
# Survey variables: compliance_profile

- name: SEC - Audit logging configuration
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: SEC - Audit logging configuration
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run host_hardening/audit_logging
      ansible.builtin.include_role:
        name: devops.aap_ops.host_hardening
        tasks_from: audit_logging

- name: Report - SEC - Audit logging configuration
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: SEC - Audit logging configuration
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
