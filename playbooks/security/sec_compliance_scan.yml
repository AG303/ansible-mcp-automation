---
# SEC - Compliance scan (CIS or STIG)
# Domain: Security Compliance. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Evaluates hosts against the selected CIS Level 1 or DISA STIG baseline subset and reports pass/fail
# per control with an overall score. Returns aap_ops_result.
# Survey variables: compliance_profile, min_score_pct

- name: SEC - Compliance scan (CIS or STIG)
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: SEC - Compliance scan (CIS or STIG)
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run compliance_baseline/scan
      ansible.builtin.include_role:
        name: devops.aap_ops.compliance_baseline
        tasks_from: scan

- name: Report - SEC - Compliance scan (CIS or STIG)
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: SEC - Compliance scan (CIS or STIG)
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
