---
# SEC - Password and lockout policy
# Domain: Security Compliance. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES SYSTEMS. Enforces password length/complexity, aging and account lockout using pwquality/faillock or
# Windows account policy. Use the WF workflow (approval required).
# Survey variables: min_length, max_age_days, lockout_attempts

- name: SEC - Password and lockout policy
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: SEC - Password and lockout policy
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run host_hardening/password_policy
      ansible.builtin.include_role:
        name: devops.aap_ops.host_hardening
        tasks_from: password_policy

- name: Report - SEC - Password and lockout policy
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: SEC - Password and lockout policy
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
