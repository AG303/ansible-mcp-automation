---
# SEC - File permission audit
# Domain: Security Compliance. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. World-writable files, unowned files and SUID/SGID binaries not on an allow-list (Linux); permissive
# ACLs on key Windows paths. Returns aap_ops_result.
# Survey variables: scan_paths

- name: SEC - File permission audit
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: SEC - File permission audit
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run host_security_audit/file_permissions_audit
      ansible.builtin.include_role:
        name: devops.aap_ops.host_security_audit
        tasks_from: file_permissions_audit

- name: Report - SEC - File permission audit
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: SEC - File permission audit
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
