---
# SEC - AAP credential audit
# Domain: Security Compliance. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. AAP credentials with type, organization, owner, last modified and whether any template uses them;
# flags unused and old credentials. Never returns secret values. Returns aap_ops_result.
# Survey variables: stale_days

- name: SEC - AAP credential audit
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SEC - AAP credential audit
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_security_audit/credential
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_security_audit
        tasks_from: credential
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
