---
# SEC - SSH hardening
# Domain: Security Compliance. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# CHANGES SYSTEMS. Applies a hardened sshd configuration (root login, ciphers, MACs, timeouts, banner) with
# config validation before reload. Linux only. Use the WF workflow (approval required).
# Survey variables: permit_root_login, allow_groups

- name: SEC - SSH hardening
  hosts: "{{ aap_ops_target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    aap_ops_report_title: SEC - SSH hardening
    aap_ops_supported_os:
      - rhel
      - ubuntu
  tasks:
    - name: Bootstrap (facts, OS detection, target tracking)
      ansible.builtin.include_role:
        name: devops.aap_ops.common
    - name: Run host_hardening/ssh_hardening
      ansible.builtin.include_role:
        name: devops.aap_ops.host_hardening
        tasks_from: ssh_hardening

- name: Report - SEC - SSH hardening
  hosts: localhost
  gather_facts: false
  vars:
    aap_ops_report_title: SEC - SSH hardening
    aap_ops_report_hosts: "{{ hostvars['localhost']._aap_ops_targets | default([]) }}"
  tasks:
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
