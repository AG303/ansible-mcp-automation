---
# SEC - AAP users and RBAC audit
# Domain: Security Compliance. Generated from catalog.yml by tools/gen_playbooks.py - edit the catalog/role, not this file.
# Read-only. Superusers, system auditors, users without recent login, team membership and organization admins
# from the platform gateway. Returns aap_ops_result.
# Survey variables: stale_days

- name: SEC - AAP users and RBAC audit
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_ops_report_title: SEC - AAP users and RBAC audit
  tasks:
    - name: AAP API connection
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_api
        public: true
    - name: Run aap_security_audit/rbac
      ansible.builtin.include_role:
        name: devops.aap_ops.aap_security_audit
        tasks_from: rbac
    - name: Publish aap_ops_result and reports
      ansible.builtin.include_role:
        name: devops.aap_ops.report
