---
# Generated by tools/gen_config.py from catalog.yml - do not edit by hand.
controller_credential_types:
- name: ServiceNow ITSM (basic auth)
  kind: cloud
  description: ServiceNow instance URL and basic-auth integration user for servicenow.itsm and the sn_api role.
  inputs:
    fields:
    - id: host
      type: string
      label: Instance URL (https://<instance>.service-now.com)
    - id: username
      type: string
      label: Username
    - id: password
      type: string
      label: Password
      secret: true
    required:
    - host
    - username
    - password
  injectors:
    env:
      SN_HOST: '{{ ''{{'' }} host {{ ''}}'' }}'
      SN_USERNAME: '{{ ''{{'' }} username {{ ''}}'' }}'
      SN_PASSWORD: '{{ ''{{'' }} password {{ ''}}'' }}'
- name: AAP Ops WinRM
  kind: cloud
  description: Windows account injected as environment variables; the windows group maps them to ansible_user/ansible_password so the Linux machine
    credential stays separate.
  inputs:
    fields:
    - id: username
      type: string
      label: Username (DOMAIN\\user or user@domain)
    - id: password
      type: string
      label: Password
      secret: true
    required:
    - username
    - password
  injectors:
    env:
      AAP_OPS_WIN_USERNAME: '{{ ''{{'' }} username {{ ''}}'' }}'
      AAP_OPS_WIN_PASSWORD: '{{ ''{{'' }} password {{ ''}}'' }}'
