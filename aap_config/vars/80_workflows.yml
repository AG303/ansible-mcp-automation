- name: WF - MON - Restart service with validation
  description: APPROVAL REQUIRED. CHANGES SYSTEMS. Restarts one service, waits for it to report running and optionally checks a TCP port. Use
    the WF workflow (approval required).
  organization: '{{ aap_ops_organization | default(''Default'') }}'
  inventory: AAP Ops - Managed Hosts
  ask_limit_on_launch: true
  ask_variables_on_launch: false
  allow_simultaneous: false
  survey_enabled: true
  survey_spec:
    name: WF - MON - Restart service with validation
    description: Inputs for WF - MON - Restart service with validation
    spec:
    - question_name: ServiceNow change request number (approved, in window)
      question_description: ServiceNow change request number (approved, in window)
      variable: sn_change_number
      type: text
      required: true
      min: 10
      max: 40
    - question_name: Service name
      question_description: Service name
      variable: service_name
      type: text
      required: true
      default: ''
      min: 0
      max: 1024
    - question_name: TCP port to verify after restart (0 skips)
      question_description: TCP port to verify after restart (0 skips)
      variable: verify_port
      type: integer
      required: false
      default: 0
      min: 0
      max: 65535
  labels:
  - aap-ops
  - server-monitoring
  - changing
  - approval-required
  - mcp-agent
  destroy_current_nodes: true
  simplified_workflow_nodes:
  - identifier: gate
    all_parents_must_converge: false
    unified_job_template: SN - Change gate
    success_nodes:
    - approve
    failure_nodes: []
    always_nodes: []
  - identifier: approve
    all_parents_must_converge: false
    approval_node:
      name: 'Approve: MON - Restart service with validation'
      description: Change gate passed (approved CR, in window, CIs cover the limit). Approve to run.
      timeout: '{{ aap_ops_approval_timeout | default(14400) }}'
    success_nodes:
    - start
    failure_nodes: []
    always_nodes: []
  - identifier: start
    all_parents_must_converge: false
    unified_job_template: SN - Change start
    success_nodes:
    - main
    failure_nodes: []
    always_nodes: []
  - identifier: main
    all_parents_must_converge: false
    unified_job_template: MON - Restart service with validation
    success_nodes:
    - close_ok
    failure_nodes:
    - close_fail
    - incident
    always_nodes: []
  - identifier: close_ok
