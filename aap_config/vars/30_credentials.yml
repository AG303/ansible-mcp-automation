---
# Generated by tools/gen_config.py from catalog.yml - do not edit by hand.
# Secrets come from vault_* variables (see aap_config/vault.example.yml).
controller_credentials:
- name: AAP Ops - Machine (Linux)
  organization: '{{ aap_ops_organization | default(''Default'') }}'
  credential_type: Machine
  inputs:
    username: '{{ vault_linux_username }}'
    ssh_key_data: '{{ vault_linux_ssh_key }}'
    become_method: sudo
- name: AAP Ops - Windows (WinRM)
  organization: '{{ aap_ops_organization | default(''Default'') }}'
  credential_type: AAP Ops WinRM
  inputs:
    username: '{{ vault_windows_username }}'
    password: '{{ vault_windows_password }}'
- name: AAP Ops - Controller API
  organization: '{{ aap_ops_organization | default(''Default'') }}'
  credential_type: Red Hat Ansible Automation Platform
  description: Least-privilege service account token for the API roles (job/RBAC audits, change gate evidence).
  inputs:
    host: '{{ aap_hostname }}'
    oauth_token: '{{ vault_aap_ops_api_token }}'
    verify_ssl: '{{ aap_validate_certs | default(true) }}'
- name: AAP Ops - OpenShift
  organization: '{{ aap_ops_organization | default(''Default'') }}'
  credential_type: OpenShift or Kubernetes API Bearer Token
  description: Service account in the AAP namespace with get/patch on AnsibleAutomationPlatform and backup CRs.
  inputs:
    host: '{{ aap_ops_ocp_api_url }}'
    bearer_token: '{{ vault_ocp_token }}'
    verify_ssl: true
- name: AAP Ops - ServiceNow
  organization: '{{ aap_ops_organization | default(''Default'') }}'
  credential_type: ServiceNow ITSM (basic auth)
  inputs:
    host: '{{ aap_ops_sn_instance_url }}'
    username: '{{ vault_sn_username }}'
    password: '{{ vault_sn_password }}'
