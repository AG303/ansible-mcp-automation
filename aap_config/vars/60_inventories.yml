---
# Generated by tools/gen_config.py from catalog.yml - do not edit by hand.
controller_inventories:
- name: AAP Ops - Managed Hosts
  organization: '{{ aap_ops_organization | default(''Default'') }}'
  description: Managed RHEL / Ubuntu / Windows hosts. Add an inventory source (Satellite, cloud, SCM) or hosts; keep Windows hosts in the windows
    group.
- name: AAP Ops - Localhost
  organization: '{{ aap_ops_organization | default(''Default'') }}'
  description: Localhost only - API, OpenShift and ServiceNow templates
controller_groups:
- name: windows
  inventory: AAP Ops - Managed Hosts
  variables:
    ansible_connection: winrm
    ansible_port: 5986
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: '{{ ''{{'' }} aap_ops_winrm_cert_validation | default(''validate'') {{ ''}}'' }}'
    ansible_user: '{{ ''{{'' }} lookup(''ansible.builtin.env'', ''AAP_OPS_WIN_USERNAME'') {{ ''}}'' }}'
    ansible_password: '{{ ''{{'' }} lookup(''ansible.builtin.env'', ''AAP_OPS_WIN_PASSWORD'') {{ ''}}'' }}'
    ansible_become: false
- name: rhel
  inventory: AAP Ops - Managed Hosts
- name: ubuntu
  inventory: AAP Ops - Managed Hosts
controller_hosts:
- name: localhost
  inventory: AAP Ops - Localhost
  variables:
    ansible_connection: local
    ansible_python_interpreter: '{{ ''{{'' }} ansible_playbook_python {{ ''}}'' }}'
