  execution_environment: AAP Ops EE
  credentials:
  - AAP Ops - Machine (Linux)
  - AAP Ops - Windows (WinRM)
  labels:
  - aap-ops
  - server-monitoring
  - read-only
  - mcp-agent
  job_type: run
  verbosity: 0
  timeout: 1800
  ask_limit_on_launch: true
  ask_variables_on_launch: false
  allow_simultaneous: true
  survey_enabled: true
  survey_spec:
    name: MON - Host health check
    description: Inputs for MON - Host health check
    spec:
    - question_name: CPU warn threshold (%)
      question_description: CPU warn threshold (%)
      variable: cpu_warn_pct
      type: integer
      required: false
      default: 85
