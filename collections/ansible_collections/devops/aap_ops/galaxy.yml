  ansible.windows: ">=2.0.0"
  community.general: ">=8.0.0,<12.0.0"
  community.windows: ">=2.0.0"
  kubernetes.core: ">=3.0.0"
  ansible.utils: ">=3.0.0"
  servicenow.itsm: ">=2.6.0"
repository: https://example.com/devops/aap26-mcp-automation
build_ignore:
  - "*.tar.gz"
