---
# Sets _updates: list of {name, version, severity, security} and _updates_security_count
- name: RHEL - list available updates
  when: aap_ops_os == 'rhel'
  ansible.builtin.shell: |
    set -o pipefail
    dnf -q updateinfo list {{ '--security' if _sec_only else '' }} --available 2>/dev/null | awk 'NF>=3 {print $2"|"$3"|"$1}' || true
    echo '---all'
    dnf -q check-update {{ '--security' if _sec_only else '' }} 2>/dev/null | awk 'NF==3 && $1 !~ /^(Obsoleting|Last)/ {print $1"|"$2}' || true
  args:
    executable: /bin/bash
  register: _lu_rhel
  changed_when: false
  check_mode: false

- name: Ubuntu - refresh apt cache
  when: aap_ops_os == 'ubuntu'
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ patch_manage_apt_cache_valid_time }}"

- name: Ubuntu - list upgradable packages
  when: aap_ops_os == 'ubuntu'
  ansible.builtin.shell: |
    set -o pipefail
    apt list --upgradable 2>/dev/null | awk -F'[/ ]' 'NR>1 {print $1"|"$3"|"$2}'
  args:
    executable: /bin/bash
  register: _lu_ubuntu
  changed_when: false
  check_mode: false

- name: Windows - search updates
  when: aap_ops_is_windows
  ansible.windows.win_updates:
    state: searched
    category_names: "{{ patch_manage_win_categories_security if _sec_only else patch_manage_win_categories_all }}"
  register: _lu_win

- name: Normalise update list
  ansible.builtin.set_fact:
    _updates: >-
      {%- set out = [] -%}
      {%- if aap_ops_os == 'rhel' -%}
      {%-   set parts = _lu_rhel.stdout.split('---all') -%}
      {%-   set adv = {} -%}
      {%-   for l in parts[0].splitlines() if '|' in l -%}
      {%-     set f = l.split('|') -%}
      {%-     set pkg = f[1] | regex_replace('-[^-]+-[^-]+$', '') -%}
      {%-     set _ = adv.update({pkg: f[0]}) -%}
      {%-   endfor -%}
      {%-   for l in parts[1].splitlines() if '|' in l -%}
      {%-     set f = l.split('|') -%}
      {%-     set sev = adv[f[0].rsplit('.', 1)[0]] | default('') -%}
      {%-     set _ = out.append({'name': f[0], 'version': f[1], 'severity': sev, 'security': sev.endswith('/Sec.') or _sec_only}) -%}
      {%-   endfor -%}
      {%- elif aap_ops_os == 'ubuntu' -%}
      {%-   for l in _lu_ubuntu.stdout_lines if '|' in l -%}
      {%-     set f = l.split('|') -%}
      {%-     set sec = '-security' in f[2] -%}
      {%-     if sec or not _sec_only -%}
      {%-       set _ = out.append({'name': f[0], 'version': f[1], 'severity': 'security' if sec else '', 'security': sec}) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- else -%}
      {%-   for k, u in (_lu_win.updates | default({})).items() -%}
      {%-     set sec = (u.categories | default([]) | select('in', ['Security Updates', 'Critical Updates']) | list | length) > 0 -%}
      {%-     set _ = out.append({'name': u.title, 'version': (u.kb | default([]) | map('regex_replace', '^', 'KB') | join(',')), 'severity': u.categories | default([]) | join(','), 'security': sec}) -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ out }}
