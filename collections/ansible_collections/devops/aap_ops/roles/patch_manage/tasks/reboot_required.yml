---
- name: Reboot required check
  block:
    - name: RHEL - needs-restarting
      when: aap_ops_os == 'rhel'
      ansible.builtin.command: needs-restarting -r
      register: _rr_rhel
      changed_when: false
      check_mode: false
      failed_when: _rr_rhel.rc not in [0, 1]

    - name: RHEL - services needing restart
      when: aap_ops_os == 'rhel'
      ansible.builtin.command: needs-restarting -s
      register: _rr_rhel_svc
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Ubuntu - reboot-required flag
      when: aap_ops_os == 'ubuntu'
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: _rr_ubuntu

    - name: Ubuntu - packages requiring reboot
      when: aap_ops_os == 'ubuntu' and _rr_ubuntu.stat.exists
      ansible.builtin.slurp:
        src: /var/run/reboot-required.pkgs
      register: _rr_ubuntu_pkgs
      failed_when: false

    - name: Windows - pending reboot keys
      when: aap_ops_is_windows
      ansible.windows.win_shell: |
        $r = @()
        if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') { $r += 'CBS RebootPending' }
        if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') { $r += 'Windows Update RebootRequired' }
        if ((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue).PendingFileRenameOperations) { $r += 'PendingFileRenameOperations' }
        ConvertTo-Json -InputObject @($r) -Compress
      register: _rr_win
      changed_when: false
      check_mode: false

    - name: Normalise
      ansible.builtin.set_fact:
        _rr: >-
          {%- if aap_ops_os == 'rhel' -%}
          {{ {'required': _rr_rhel.rc == 1, 'reasons': _rr_rhel.stdout_lines | select('search', 'kernel|glibc|systemd|Core libraries') | list,
              'services_to_restart': _rr_rhel_svc.stdout_lines | default([])} }}
          {%- elif aap_ops_os == 'ubuntu' -%}
          {{ {'required': _rr_ubuntu.stat.exists,
              'reasons': ((_rr_ubuntu_pkgs.content | default('') | b64decode).splitlines()) if _rr_ubuntu.stat.exists else [],
              'services_to_restart': []} }}
          {%- else -%}
          {%-   set k = _rr_win.stdout | trim | from_json -%}
          {{ {'required': k | length > 0, 'reasons': k, 'services_to_restart': []} }}
          {%- endif -%}

    - name: Record result
      ansible.builtin.set_fact:
        aap_ops_host_result:
          status: "{{ 'warn' if _rr.required else 'ok' }}"
          summary: "{{ ('Reboot required: ' ~ (_rr.reasons | join(', ') | truncate(200))) if _rr.required else 'No reboot required' }}"
          details: "{{ _rr }}"
  rescue:
    - name: Convert failure to result
      ansible.builtin.include_role: {name: devops.aap_ops.common, tasks_from: rescue}
      vars: {aap_ops_check_name: Reboot required}
