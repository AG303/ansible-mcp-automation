---
# CHANGING. Password length/complexity, aging and lockout.
- name: Password and lockout policy
  block:
    - name: Linux - pwquality package
      when: not aap_ops_is_windows
      ansible.builtin.package:
        name: "{{ 'libpwquality' if aap_ops_os == 'rhel' else 'libpam-pwquality' }}"
        state: present
      register: _hh_pkg_pwq

    - name: Linux - pwquality settings
      when: not aap_ops_is_windows
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*#?\s*{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value }}"
      loop: "{{ {'minlen': min_length | default(14), 'minclass': host_hardening_pw_min_class, 'maxrepeat': 3, 'dictcheck': 1} | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: _hh_pwq
      # Check mode: the package is not really installed, so pwquality.conf may be missing.
      ignore_errors: "{{ ansible_check_mode and (_hh_pkg_pwq is changed) }}"  # noqa: ignore-errors  check mode only: package not installed yet

    - name: Linux - password aging defaults
      when: not aap_ops_is_windows
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*#?\s*{{ item.key }}\s'
        line: "{{ item.key }}\t{{ item.value }}"
      loop: "{{ {'PASS_MAX_DAYS': max_age_days | default(365), 'PASS_MIN_DAYS': host_hardening_pw_min_days, 'PASS_WARN_AGE': host_hardening_pw_warn_age} | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: _hh_age

    - name: Linux - faillock settings
      when: not aap_ops_is_windows
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^\s*#?\s*{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value }}"
        create: true
        mode: "0644"
      loop: "{{ {'deny': lockout_attempts | default(5), 'unlock_time': host_hardening_lockout_unlock_time, 'fail_interval': host_hardening_lockout_window} | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: _hh_fl

    - name: RHEL - enable faillock in authselect profile
      when: aap_ops_os == 'rhel'
      ansible.builtin.shell: |
        if authselect current >/dev/null 2>&1; then
          authselect current | grep -q with-faillock && echo unchanged || { authselect enable-feature with-faillock && authselect apply-changes && echo changed; }
        else echo "no-authselect"; fi
      register: _hh_authselect
      changed_when: "'changed' in _hh_authselect.stdout"

    - name: Ubuntu - pam-auth-update faillock profiles
      when: aap_ops_os == 'ubuntu'
      ansible.builtin.copy:
        dest: "/usr/share/pam-configs/{{ item.name }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: aap_ops_faillock
          content: |
            Name: Enable pam_faillock to deny access (AAP Ops)
            Default: yes
            Priority: 0
            Auth-Type: Primary
            Auth:
                [default=die] pam_faillock.so authfail
        - name: aap_ops_faillock_notify
          content: |
            Name: Notify of failed login attempts and reset count upon success (AAP Ops)
            Default: yes
            Priority: 1024
            Auth-Type: Primary
            Auth:
                requisite pam_faillock.so preauth
            Account-Type: Primary
            Account:
                required pam_faillock.so
      loop_control:
        label: "{{ item.name }}"
      register: _hh_pamcfg

    - name: Ubuntu - activate profiles
      when: aap_ops_os == 'ubuntu' and _hh_pamcfg.changed
      ansible.builtin.command: pam-auth-update --enable aap_ops_faillock aap_ops_faillock_notify
      changed_when: true

    - name: Windows - account policy
      when: aap_ops_is_windows
      community.windows.win_security_policy:
        section: System Access
        key: "{{ item.key }}"
        value: "{{ item.value }}"
      loop: >-
        {{ {'MinimumPasswordLength': min_length | default(14), 'MaximumPasswordAge': max_age_days | default(365),
            'MinimumPasswordAge': host_hardening_pw_min_days, 'PasswordComplexity': 1, 'PasswordHistorySize': 24,
            'LockoutBadCount': lockout_attempts | default(5), 'ResetLockoutCount': (host_hardening_lockout_window / 60) | int,
            'LockoutDuration': (host_hardening_lockout_unlock_time / 60) | int} | dict2items }}
      loop_control:
        label: "{{ item.key }}"
      register: _hh_win

    - name: Record result
      ansible.builtin.set_fact:
        aap_ops_host_result:
          status: "{{ 'changed' if _chg else 'ok' }}"
          summary: "min length {{ min_length | default(14) }}, max age {{ max_age_days | default(365) }}d, lockout after {{ lockout_attempts | default(5) }} failures{{ '' if _chg else ' - already compliant' }}"
          details:
            min_length: "{{ min_length | default(14) }}"
            max_age_days: "{{ max_age_days | default(365) }}"
            lockout_attempts: "{{ lockout_attempts | default(5) }}"
            note: Aging applies to new passwords; use chage/net accounts to apply to existing accounts.
      vars:
        _chg: >-
          {{ (_hh_pwq.changed | default(false)) or (_hh_age.changed | default(false)) or (_hh_fl.changed | default(false))
             or (_hh_authselect.changed | default(false)) or (_hh_pamcfg.changed | default(false)) or (_hh_win.changed | default(false)) }}
  rescue:
    - name: Convert failure to result
      ansible.builtin.include_role: {name: devops.aap_ops.common, tasks_from: rescue}
      vars: {aap_ops_check_name: Password policy}
