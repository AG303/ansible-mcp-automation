---
- name: Network diagnostics
  block:
    - name: Linux - gateway, DNS and interface errors
      when: not aap_ops_is_windows
      ansible.builtin.shell: |
        gw="{{ ansible_default_ipv4.gateway | default('') }}"
        gw_ok=false; [ -n "$gw" ] && ping -c 2 -W 2 "$gw" >/dev/null 2>&1 && gw_ok=true
        printf '{"gateway":"%s","gateway_reachable":%s,"dns":[' "$gw" "$gw_ok"
        first=1
        for n in $(echo {{ (dns_names | default('redhat.com')) | quote }} | tr ',' ' '); do
          ip=$(getent ahosts "$n" | awk 'NR==1{print $1}')
          [ $first -eq 0 ] && printf ','; first=0
          printf '{"name":"%s","resolved":%s,"address":"%s"}' "$n" "$( [ -n "$ip" ] && echo true || echo false )" "$ip"
        done
        printf '],"interfaces":['
        first=1
        for i in $(ls /sys/class/net | grep -v '^lo$'); do
          rx=$(cat /sys/class/net/$i/statistics/rx_errors 2>/dev/null || echo 0); tx=$(cat /sys/class/net/$i/statistics/tx_errors 2>/dev/null || echo 0)
          dr=$(cat /sys/class/net/$i/statistics/rx_dropped 2>/dev/null || echo 0); st=$(cat /sys/class/net/$i/operstate 2>/dev/null)
          [ $first -eq 0 ] && printf ','; first=0
          printf '{"name":"%s","state":"%s","rx_errors":%s,"tx_errors":%s,"rx_dropped":%s}' "$i" "$st" "$rx" "$tx" "$dr"
        done
        printf ']}'
      args:
        executable: /bin/bash
      changed_when: false
      check_mode: false
      register: _nd_linux

    - name: Windows - gateway, DNS and adapter errors
      when: aap_ops_is_windows
      ansible.windows.win_shell: |
        $gw = (Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue | Sort-Object RouteMetric | Select-Object -First 1).NextHop
        $gwOk = if ($gw) { Test-Connection -ComputerName $gw -Count 2 -Quiet } else { $false }
        $dns = '{{ dns_names | default('redhat.com') }}'.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ } | ForEach-Object {
          $r = Resolve-DnsName -Name $_ -Type A -ErrorAction SilentlyContinue | Where-Object { $_.IPAddress } | Select-Object -First 1
          @{ name = $_; resolved = [bool]$r; address = "$($r.IPAddress)" } }
        $ifs = Get-NetAdapter | ForEach-Object { $s = $_ | Get-NetAdapterStatistics -ErrorAction SilentlyContinue
          @{ name = $_.Name; state = "$($_.Status)"; rx_errors = [int64]$s.ReceivedPacketErrors; tx_errors = [int64]$s.OutboundPacketErrors; rx_dropped = [int64]$s.ReceivedDiscardedPackets } }
        @{ gateway = "$gw"; gateway_reachable = [bool]$gwOk; dns = @($dns); interfaces = @($ifs) } | ConvertTo-Json -Depth 4 -Compress
      changed_when: false
      check_mode: false
      register: _nd_win

    - name: Record result
      ansible.builtin.set_fact:
        aap_ops_host_result:
          status: >-
            {{ 'fail' if (not _nd.gateway_reachable or _nd.dns | rejectattr('resolved') | list | length > 0)
               else ('warn' if _nd.interfaces | selectattr('rx_errors', '>', 0) | list | length > 0 or _nd.interfaces | selectattr('tx_errors', '>', 0) | list | length > 0 else 'ok') }}
          summary: >-
            gateway {{ _nd.gateway or 'none' }} {{ 'reachable' if _nd.gateway_reachable else 'UNREACHABLE' }};
            DNS {{ _nd.dns | selectattr('resolved') | list | length }}/{{ _nd.dns | length }} resolved;
            {{ _nd.interfaces | selectattr('rx_errors', '>', 0) | list | length + _nd.interfaces | selectattr('tx_errors', '>', 0) | list | length }} interface error counters non-zero
          details: "{{ _nd | combine({'ipv4': ansible_all_ipv4_addresses | default(ansible_ip_addresses | default([]))}) }}"
      vars:
        _nd: "{{ (_nd_win if aap_ops_is_windows else _nd_linux).stdout | from_json }}"
  rescue:
    - name: Convert failure to result
      ansible.builtin.include_role: {name: devops.aap_ops.common, tasks_from: rescue}
      vars: {aap_ops_check_name: Network diagnostics}
