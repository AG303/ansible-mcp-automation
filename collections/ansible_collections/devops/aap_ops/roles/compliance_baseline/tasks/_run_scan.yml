---
# Runs the generated scan script. Output: _scan (list of {id,title,section,severity,pass,automatable})
- name: Linux - run baseline checks
  when: not aap_ops_is_windows
  ansible.builtin.shell: "{{ lookup('ansible.builtin.template', 'scan_linux.sh.j2') }}"
  args:
    executable: /bin/bash
  register: _scan_raw_linux
  changed_when: false
  check_mode: false

- name: Windows - run baseline checks
  when: aap_ops_is_windows
  ansible.windows.win_shell: "{{ lookup('ansible.builtin.template', 'scan_windows.ps1.j2') }}"
  register: _scan_raw_win
  changed_when: false
  check_mode: false

- name: Build scan results
  ansible.builtin.set_fact:
    _scan: >-
      {%- set res = {} -%}
      {%- if aap_ops_is_windows -%}
      {%-   set res = _scan_raw_win.stdout | from_json -%}
      {%- else -%}
      {%-   for l in _scan_raw_linux.stdout_lines if '|' in l -%}
      {%-     set _ = res.update({l.split('|')[0]: l.split('|')[1] == '0'}) -%}
      {%-   endfor -%}
      {%- endif -%}
      {%- set out = [] -%}
      {%- for c in _controls -%}
      {%-   set _ = out.append({'id': c.id, 'title': c.title, 'section': c.section, 'severity': c.severity,
                               'pass': res[c.id] | default(false) | bool, 'automatable': c.fix.type != 'manual'}) -%}
      {%- endfor -%}
      {{ out }}
