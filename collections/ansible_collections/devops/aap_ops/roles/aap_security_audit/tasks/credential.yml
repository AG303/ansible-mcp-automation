---
# Reports credential METADATA only. Secret inputs are never read into results.
- name: Credential audit
  block:
    - name: Get credentials
      ansible.builtin.include_role: {name: devops.aap_ops.aap_api, tasks_from: get}
      vars:
        aap_api_path: "{{ aap_api_c }}/credentials/"
        aap_api_query: {order_by: name}

    - name: Strip credential inputs immediately
      ansible.builtin.set_fact:
        _creds: >-
          {{ aap_api_results | map('ansible.utils.remove_keys', target=['inputs']) | list }}
      no_log: true

    - name: Get job templates (for usage)
      ansible.builtin.include_role: {name: devops.aap_ops.aap_api, tasks_from: get}
      vars:
        aap_api_path: "{{ aap_api_c }}/job_templates/"

    - name: Build report rows
      ansible.builtin.set_fact:
        aap_ops_report_rows: "{{ [_summary] + (_rows | rejectattr('status', 'equalto', 'ok') | list) }}"
      vars:
        _used: "{{ aap_api_results | map(attribute='summary_fields.credentials') | flatten | map(attribute='id') | unique | list }}"
        _rows: >-
          {%- set out = [] -%}
          {%- for c in _creds -%}
          {%-   set age = ((now().timestamp() - ((c.modified[:19] ~ '+0000') | to_datetime('%Y-%m-%dT%H:%M:%S%z')).timestamp()) / 86400) | int -%}
          {%-   set kind = c.summary_fields.credential_type.name | default(c.kind | default('?')) -%}
          {%-   set issues = [] -%}
          {%-   if age > (stale_days | default(180) | int) -%}{%- set _ = issues.append('not rotated in ' ~ age ~ ' days') -%}{%- endif -%}
          {%-   if c.id not in _used and kind in ['Machine', 'Source Control', 'Vault', 'Network'] -%}{%- set _ = issues.append('not attached to any job template') -%}{%- endif -%}
          {%-   if not c.organization -%}{%- set _ = issues.append('personal credential (no organization)') -%}{%- endif -%}
          {%-   set _ = out.append({'host': c.name, 'status': 'warn' if issues else 'ok',
                 'summary': kind ~ ', modified ' ~ age ~ ' days ago' ~ ((' - ' ~ issues | join('; ')) if issues else ''),
                 'details': {'id': c.id, 'type': kind, 'organization': c.summary_fields.organization.name | default(''),
                             'created_by': c.summary_fields.created_by.username | default(''), 'age_days': age, 'issues': issues}}) -%}
          {%- endfor -%}
          {{ out }}
        _summary:
          host: summary
          status: "{{ 'warn' if _rows | selectattr('status', 'equalto', 'warn') | list | length > 0 else 'ok' }}"
          summary: >-
            {{ _creds | length }} credentials audited (metadata only);
            {{ _rows | selectattr('status', 'equalto', 'warn') | list | length }} with findings (rotation threshold {{ stale_days | default(180) }} days)
          details:
            by_type: >-
              {%- set c = {} -%}
              {%- for r in _rows -%}{%- set _ = c.update({r.details.type: c.get(r.details.type, 0) + 1}) -%}{%- endfor -%}
              {{ c }}
  rescue:
    - name: Convert failure to result
      ansible.builtin.include_role: {name: devops.aap_ops.common, tasks_from: rescue_api}
      vars: {aap_ops_check_name: Credential audit}
